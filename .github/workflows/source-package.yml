name: Source installation package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: VLAA-v0.2.0-source-installation
          path: |
            release/VLAA-v0.2.0-source.zip
            release/VLAA-v0.2.0-manifest.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
